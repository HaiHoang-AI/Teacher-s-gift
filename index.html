<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dòng chảy 9+ — Tri ân thầy Nguyễn Huy Hoàng</title>
<meta name="description" content="Cuốn scrapbook nhỏ của lớp 12V1 — Dòng chảy 9+ gửi thầy Nguyễn Huy Hoàng nhân ngày Nhà giáo Việt Nam 20/11.">
<meta property="og:title" content="Dòng chảy 9+ — Tri ân thầy Hoàng">
<meta property="og:description" content="Ai đã đặt tên cho dòng chảy? Scrapbook của lớp 12V1 gửi thầy nhân ngày 20/11.">
<meta property="og:image" content="assets/img/anh-510408850.jpg">
<link rel="icon" href="assets/img/con-dau.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&amp;family=Lora:ital,wght@0,400;0,500;1,400&amp;family=Dancing+Script:wght@700&amp;family=Patrick+Hand&amp;display=swap">
<style>
body{margin:0;background:#D6BF97}
a{color:#C8361D}a:hover{color:#8E2414}
.desk{background:#D6BF97 url(assets/img/nen-kraft.jpg) center top/900px repeat}
.desk *{box-sizing:border-box}
.sheet{position:relative;max-width:1160px;margin:0 auto 64px;padding:104px 56px 120px}
.sheet>.paper{position:absolute;inset:0;z-index:0;clip-path:polygon(0% 14px,4% 4px,9% 12px,14% 2px,19% 10px,25% 3px,31% 12px,37% 5px,43% 13px,49% 2px,55% 11px,61% 4px,67% 12px,73% 3px,79% 10px,85% 2px,91% 12px,96% 5px,100% 11px,100% calc(100% - 12px),96% calc(100% - 3px),90% calc(100% - 11px),84% calc(100% - 2px),78% calc(100% - 12px),72% calc(100% - 4px),66% calc(100% - 13px),60% calc(100% - 3px),54% calc(100% - 10px),48% calc(100% - 2px),42% calc(100% - 12px),36% calc(100% - 4px),30% calc(100% - 11px),24% calc(100% - 2px),18% calc(100% - 12px),12% calc(100% - 3px),6% calc(100% - 10px),0% calc(100% - 4px))}
.tex{background-image:url(assets/img/nen-giay.jpg);background-size:760px;background-blend-mode:multiply}
.dots{background-image:radial-gradient(rgba(255,230,170,.1) 1px,transparent 1.6px);background-size:20px 20px}
.sheet>.in{position:relative;z-index:2}
.shadow{filter:drop-shadow(0 18px 26px rgba(70,45,15,.3))}
.persp{perspective:1000px}
.kicker{font-family:'Patrick Hand',cursive;font-size:25px;letter-spacing:.03em}
.h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(48px,7vw,94px);line-height:1.02;margin:0;letter-spacing:-.01em}
.h2,.chip,[style*="Fraunces"]{font-variation-settings:'SOFT' 100;font-optical-sizing:auto}
.hand{font-family:'Patrick Hand',cursive}
.tape{position:absolute;z-index:4;width:132px;height:30px;background-position:center;background-size:100% 100%;background-repeat:no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.tape.top{top:-14px;left:50%;margin-left:-66px;transform:rotate(-4deg)}
.tape.tl{top:-4px;left:-38px;transform:rotate(-38deg)}
.tape.tr{top:-4px;right:-38px;transform:rotate(38deg)}
.t-pink{background-image:url(assets/img/washi-hong.png)}
.t-mint{background-image:url(assets/img/washi-mint.png)}
.t-sun{background-image:url(assets/img/washi-vang.png)}
.t-ink{background-image:url(assets/img/washi-cham.png)}
.t-red{background-image:url(assets/img/washi-do.png)}
.t-tre{background-image:url(assets/img/washi-tre.png)}
.silk{background:url(assets/img/tam-lua.png) center/92% auto no-repeat}
.pol{position:relative;background:#FFFDF6;padding:12px 12px 16px;box-shadow:0 10px 24px rgba(60,35,10,.24);transform:rotate(var(--t,0deg));transition:transform .5s cubic-bezier(.3,1.6,.5,1),box-shadow .5s}
.pol:hover{transform:rotate(0deg) translateY(-12px) scale(1.05);box-shadow:0 26px 44px rgba(60,35,10,.34);z-index:5}
.pol img{display:block;width:100%;object-fit:cover}
.pol figcaption{font-family:'Patrick Hand',cursive;font-size:22px;text-align:center;margin-top:10px;color:#2A231C}
.clip{position:relative;margin:0;background:#F4EBD8;padding:10px 10px 12px;box-shadow:0 8px 18px rgba(60,35,10,.24);transform:rotate(var(--t,0deg));transition:transform .5s cubic-bezier(.3,1.6,.5,1),box-shadow .5s}
.clip:hover{transform:rotate(0deg) translateY(-10px) scale(1.06);box-shadow:0 22px 38px rgba(60,35,10,.32);z-index:5}
.clip img{display:block;width:100%;object-fit:cover;filter:sepia(.18) contrast(1.03)}
.clip figcaption{font-family:'Patrick Hand',cursive;font-size:18px;line-height:1.3;color:#6B5229;margin-top:8px;text-align:center}
.sticky{background:#FBE7A1;padding:20px 22px;box-shadow:0 10px 18px rgba(60,35,10,.2);transform:rotate(var(--t,0deg));transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.sticky:hover{transform:rotate(0deg) scale(1.06)}
.deco{position:absolute;z-index:3}
.stk{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(60,35,10,.28));transition:transform .4s cubic-bezier(.3,1.6,.5,1),filter .4s;cursor:default}
.stk:hover{transform:scale(1.1) rotate(-4deg);filter:drop-shadow(0 16px 18px rgba(60,35,10,.32))}
.wig:hover{animation:wig .6s ease-in-out}
.bob{animation:bob 4.5s ease-in-out infinite}
.bob2{animation:bob 5.5s 1s ease-in-out infinite}
.swing{transform-origin:50% 0;animation:swing 5s ease-in-out infinite}
.swing:hover{animation-duration:1.2s}
.spin{animation:spin 2.4s linear infinite}
.reel:hover{animation:spin 2.4s linear infinite}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:.8em;padding:0 .12em;margin:0 .04em;transform:rotate(var(--t,0deg));transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.chip:hover{transform:rotate(0deg) translateY(-10px) scale(1.12)}
.ld{animation:popt .9s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0s)}
.flip{position:relative;display:block;width:100%;height:360px;padding:0;border:none;background:none;cursor:pointer;perspective:1000px;font:inherit;color:inherit;text-align:center}
.flip .inner{position:absolute;inset:0;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip:hover .inner,.flip:focus-visible .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px}
.face.back{transform:rotateY(180deg)}
.env{position:relative;display:block;width:100%;aspect-ratio:3 / 2;padding:0;border:none;background:none;cursor:pointer;font:inherit;color:inherit;perspective:700px}
.env .body{position:absolute;inset:0;background:#E3C690;box-shadow:0 10px 20px rgba(70,40,10,.2)}
.env .letter{position:absolute;left:9%;right:9%;top:12%;height:70%;background:#FFFDF6;z-index:1;transition:transform .55s cubic-bezier(.3,1.5,.5,1);padding:12px;font-family:'Patrick Hand',cursive;font-size:16px;color:#6B5229;text-align:left}
.env .pocket{position:absolute;inset:0;z-index:2;background:#EBD3A3;clip-path:polygon(0 30%,50% 66%,100% 30%,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:3;background:#D9B675;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .5s ease,z-index 0s .25s}
.env:hover .flap,.env:focus-visible .flap{transform:rotateX(180deg);z-index:0}
.env:hover .letter,.env:focus-visible .letter{transform:translateY(-42%)}
.env .seal{position:absolute;left:50%;top:52%;z-index:4;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#C8361D;color:#F8E9C8;display:flex;align-items:center;justify-content:center;font-family:'Dancing Script',cursive;font-size:20px;box-shadow:0 0 0 3px rgba(200,54,29,.35);transition:opacity .3s}
.env:hover .seal{opacity:0}
.env .who{position:absolute;left:0;right:0;bottom:12px;z-index:4;font-family:'Dancing Script',cursive;font-size:22px;color:#3B2A12;text-align:center}
.stele{transition:transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .45s}
.stele:hover{transform:translateY(-12px);box-shadow:0 0 0 2px #E3B556,0 18px 30px rgba(227,181,86,.35)}
.lamp{transition:filter .4s}
.lamp:hover{filter:brightness(1.3) drop-shadow(0 0 34px rgba(255,190,80,.95))}
@media (max-width:720px){.sheet{padding:80px 20px 96px}.hide-m{display:none}}
@keyframes popt{0%{opacity:0;scale:.4;rotate:-14deg}70%{opacity:1;scale:1.08;rotate:3deg}100%{opacity:1;scale:1;rotate:0deg}}
@keyframes wig{0%,100%{rotate:0deg}20%{rotate:-9deg}40%{rotate:7deg}60%{rotate:-5deg}80%{rotate:3deg}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
@keyframes swing{0%,100%{rotate:-5deg}50%{rotate:5deg}}
@keyframes spin{to{rotate:360deg}}
@keyframes up{from{opacity:0;translate:0 80px}to{opacity:1;translate:0 0}}
@keyframes pop{0%{opacity:0;scale:.45;rotate:-12deg}70%{opacity:1;scale:1.07;rotate:3deg}100%{opacity:1;scale:1;rotate:0deg}}
@keyframes fromL{0%{opacity:0;translate:-160px 0;rotate:-10deg}75%{opacity:1;translate:10px 0;rotate:2deg}100%{opacity:1;translate:0 0;rotate:0deg}}
@keyframes fromR{0%{opacity:0;translate:160px 0;rotate:10deg}75%{opacity:1;translate:-10px 0;rotate:-2deg}100%{opacity:1;translate:0 0;rotate:0deg}}
@keyframes stand{0%{opacity:0;rotate:x 88deg}70%{opacity:1;rotate:x -10deg}100%{opacity:1;rotate:x 0deg}}
@keyframes stampin{0%{opacity:0;scale:2.8;rotate:-30deg}60%{opacity:1;scale:.9;rotate:-6deg}100%{opacity:1;scale:1;rotate:-8deg}}
@keyframes drop{0%{opacity:0;translate:0 -120px;rotate:-14deg}70%{opacity:1;translate:0 10px;rotate:3deg}100%{opacity:1;translate:0 0;rotate:0deg}}
@keyframes para{from{translate:0 90px}to{translate:0 -90px}}
@keyframes sail{from{translate:-40vw 0}to{translate:40vw 0}}
@keyframes sailR{from{translate:45vw 0}to{translate:-45vw 0}}
@keyframes draw{from{stroke-dashoffset:1800}to{stroke-dashoffset:0}}
@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.rv{animation-duration:1ms;animation-timing-function:linear;animation-fill-mode:both;animation-timeline:view();animation-range:entry 0% cover 32%}
.up{animation-name:up}.pop{animation-name:pop}.fromL{animation-name:fromL}.fromR{animation-name:fromR}.drop{animation-name:drop}.stampin{animation-name:stampin}
.stand{animation-name:stand;transform-origin:50% 100%}
.late{animation-range:entry 20% cover 45%}
.para{animation:para linear both;animation-timeline:view();animation-range:cover}
.sail{animation:sail linear both;animation-timeline:view();animation-range:cover}
.sailR{animation:sailR linear both;animation-timeline:view();animation-range:cover}
.drawon{stroke-dasharray:1800;animation:draw linear both;animation-timeline:view();animation-range:entry 10% cover 60%}
}
}
@media (prefers-reduced-motion: reduce){.ld,.bob,.bob2,.swing,.spin,.wig:hover{animation:none}}
</style>
<style>#letterModal[hidden]{display:none !important}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<main class="desk" style="font-family: 'Lora', serif; color: #2A231C; padding: 40px 16px 24px; overflow-x: hidden">

<section class="sheet shadow" style="transform: rotate(-.4deg); padding-top: 80px">
<div class="paper tex" style="background-color: #F6EDDA"></div>
<div class="in">
<div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px" class="hand">
<span class="ld" style="--d: .1s; font-size: 21px; color: #7A5B2E">Tập scrapbook · Lớp 12V1</span>
<span class="ld" style="--d: .2s; font-size: 21px; color: #7A5B2E">20 · 11 · 2026</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 56px; margin-top: 40px">
<div style="flex: 1 1 440px; min-width: 0; position: relative">
<p class="ld hand" style="--d: .3s; margin: 0 0 14px; font-size: 26px; color: #C8361D">Kính tặng thầy Nguyễn Huy Hoàng</p>
<p class="ld" style="--d: .45s; margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-size: clamp(36px, 4.8vw, 58px); line-height: 1">Ai đã đặt tên cho</p>
<h1 style="margin: 14px 0 0; font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(44px, 6.4vw, 92px); line-height: 1.15; display: flex; flex-wrap: wrap; gap: .1em .4em">
<sc-for list="{{titleWords}}" as="tw" hint-placeholder-count="2">
<span style="display: inline-flex; flex-wrap: nowrap; white-space: nowrap">
<sc-for list="{{tw.chips}}" as="c" hint-placeholder-count="4">
<span class="chip ld" style="--d: {{c.d}}s; --t: {{c.t}}deg; background: {{c.bg}}; color: {{c.fg}}">{{c.ch}}</span>
</sc-for>
</span>
</sc-for>
</h1>
<img class="ld" src="assets/img/gach-chan.png" alt="" style="--d: 1.4s; display: block; width: 260px; margin: 2px 0 0 24px">
<p class="ld" style="--d: 1.5s; margin: 18px 0 0; max-width: 470px; font-size: 19px; line-height: 1.8">Một năm học Văn, mười mấy trang đời. Cuốn scrapbook nhỏ của lớp 12V1 — Dòng chảy 9+, dán đầy ảnh, chữ và những điều chúng con chưa kịp nói.</p>
<div class="ld" style="--d: 1.7s; margin-top: 18px; width: min(380px, 100%)"><img class="stk wig" src="assets/img/dong-song.png" alt="Sticker dòng sông"></div>
<p class="ld hand" style="--d: 1.9s; margin: 22px 0 0; display: inline-flex; align-items: center; gap: 12px; font-size: 22px; color: #1F6F6B">Lướt xuống để mở từng trang
<img class="bob" src="assets/img/mui-ten.png" alt="" style="width: 70px; rotate: 90deg"></p>
</div>
<div style="flex: 1 1 420px; min-width: 0; position: relative; min-height: 560px">
<figure class="pol ld" style="--d: .5s; --t: 3deg; position: absolute; right: 0; top: 20px; width: 76%; margin: 0">
<span class="tape top t-pink"></span>
<img src="assets/img/anh-510408850.jpg" alt="Lễ dâng hương của lớp trước điện Văn Miếu" style="aspect-ratio: 5 / 4; object-position: 50% 60%">
<figcaption>Lễ dâng hương · 21/6/2025</figcaption>
</figure>
<figure class="pol ld" style="--d: .8s; --t: -6deg; position: absolute; left: 0; bottom: 20px; width: 50%; margin: 0">
<span class="tape tl t-mint"></span>
<img src="assets/img/anh-536279767.jpg" alt="Thầy ôm bó hoa của lớp" style="aspect-ratio: 1 / 1; object-position: 50% 25%">
<figcaption>Bó hoa của lớp</figcaption>
</figure>
<div class="deco ld hide-m" style="--d: 1.25s; left: -30px; top: -20px; width: 150px"><img class="stk wig" src="assets/img/hoa-phuong.png" alt="Sticker hoa phượng"></div>
<div class="deco ld hide-m" style="--d: 1.35s; right: -40px; top: -40px; width: 104px; rotate: 10deg"><img class="stk wig" src="assets/img/tem-van-mieu.png" alt="Tem Văn Miếu"></div>
<div class="deco ld" style="--d: 1.5s; left: 46%; bottom: 0; width: 96px; rotate: -10deg">
<img class="stk" src="assets/img/con-dau.png" alt="">
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Dancing Script', cursive; font-size: 36px; color: #C8361D; pointer-events: none">9+</span>
</div>
<div class="deco hide-m bob2" style="left: 40%; top: -6px; width: 34px"><img class="stk" src="assets/img/lap-lanh.png" alt=""></div>
</div>
</div>
</div>
</section>

<section class="sheet shadow" style="transform: rotate(.5deg); color: #F2E3C6">
<div class="paper dots" style="background-color: #3A1310"></div>
<div class="in">
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between">
<div class="persp" style="flex: 1 1 420px; min-width: 0"><div class="rv stand">
<p class="kicker" style="margin: 0; color: #E3B556">Chương I · mượn “Chữ người tử tù” — Nguyễn Tuân</p>
<h2 class="h2" style="margin-top: 14px">Cảnh cho chữ</h2>
</div></div>
<div class="rv pop" style="flex: 0 0 200px"><img class="stk wig" src="assets/img/but-long-duoc.png" alt="Sticker bút lông, nghiên mực và ngọn đuốc"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center; margin: 40px 0 56px">
<div style="flex: 1 1 360px; min-width: 0">
<p class="rv up" style="margin: 0; font-size: 19px; line-height: 1.85; color: #E4D2B4">Ánh đuốc đỏ rực, tấm lụa trắng tinh, từng nét chữ dồn hết tâm huyết. Lớp của thầy không có ngục tù, nhưng có những đêm ôn thi như thế — và thầy đã cho chúng con ba con chữ. <span class="hand" style="color: #F2C063; font-size: 22px">Rê chuột (hoặc chạm) vào tấm lụa để lật.</span></p>
<div class="rv fromL late" style="max-width: 400px; margin-top: 32px">
<figure class="clip" style="--t: -3deg">
<span class="tape top t-sun"></span>
<img src="assets/img/tp-chu-nguoi-tu-tu.jpg" alt="Tranh minh hoạ cảnh cho chữ trong Chữ người tử tù" style="aspect-ratio: 630 / 495">
<figcaption>“Một cảnh tượng xưa nay chưa từng có”</figcaption>
</figure>
</div>
</div>
<div class="rv fromR" style="flex: 0 1 280px; min-width: 0">
<figure class="pol" style="--t: 4deg; margin: 0">
<span class="tape top t-red"></span>
<img src="assets/img/anh-511087100.jpg" alt="Thầy mặc áo dài đỏ dưới băng rôn Lễ dâng hương" style="aspect-ratio: 3 / 4; object-position: 50% 20%">
<figcaption>Người cho chữ</figcaption>
</figure>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px">
<sc-for list="{{words}}" as="w" hint-placeholder-count="3">
<div class="rv pop">
<button type="button" class="flip" aria-label="{{w.label}}">
<span class="inner">
<span class="face silk" style="color: #2A231C">
<span style="font-family: 'Dancing Script', cursive; font-size: 64px; line-height: 1; color: #C8361D">{{w.word}}</span>
<span class="hand" style="font-size: 19px; color: #F2C063; position: absolute; bottom: 22px">lật tấm lụa</span>
</span>
<span class="face back" style="background: #C8361D; color: #FBE6BE; box-shadow: 0 0 60px rgba(240,140,40,.3)">
<span style="font-family: 'Fraunces', serif; font-style: italic; font-size: 30px; line-height: 1.3">{{w.quote}}</span>
<span style="width: 46px; height: 46px; border: 2px solid #FBE6BE; font-size: 12px; display: flex; align-items: center; justify-content: center">Hoàng</span>
</span>
</span>
</button>
</div>
</sc-for>
</div>
</div>
</section>

<section class="sheet shadow" style="transform: rotate(-.6deg); color: #EFE3C8; padding-bottom: 200px">
<div class="paper dots" style="background-color: #1B2747"></div>
<div class="in">
<div style="display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start">
<div style="flex: 1 1 360px; min-width: 0">
<div class="persp"><div class="rv stand">
<p class="kicker" style="margin: 0; color: #F2C063">Chương II · mượn “Hai đứa trẻ” — Thạch Lam</p>
<h2 class="h2" style="margin-top: 14px">Ngọn đèn<br>những tối ôn thi</h2>
</div></div>
<p class="rv up" style="margin: 28px 0 0; font-size: 19px; line-height: 1.85; color: #DCD3C0">Như chị em Liên chờ chuyến tàu đêm, chúng con chờ một điều sáng hơn: điểm 9+ mùa hè năm ấy. Giữa những tối dài, lớp Văn của thầy là ngọn đèn không tắt.</p>
<div class="rv pop" style="margin-top: 36px; display: flex; align-items: center; gap: 24px">
<div class="lamp" style="width: 120px; flex: none"><img class="stk bob" src="assets/img/den-dau.png" alt="Sticker ngọn đèn dầu"></div>
<div class="sticky hand" style="--t: -3deg; font-size: 23px; color: #3B2A12; max-width: 250px">“Từ trang giấy mỏng đến ánh đèn đêm…”</div>
</div>
</div>

const comp = new Component({});
const audio = document.getElementById('song');
const get = (scope, path) => path.trim().split('.').reduce((o, k) => (o == null ? o : o[k]), scope);
const holeOnly = /^\{\{\s*([^}]+?)\s*\}\}$/;
const fill = (str, scope) => str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (_, p) => { const v = get(scope, p); return v == null ? '' : v; });
function walk(node, scope) {
  for (const child of [...node.childNodes]) {
    if (child.nodeType === 3) { if (child.nodeValue.includes('{{')) child.nodeValue = fill(child.nodeValue, scope); continue; }
    if (child.nodeType !== 1) continue;
    if (child.localName === 'sc-for') {
      const list = get(scope, child.getAttribute('list').replace(/[{}]/g, '')) || [];
      const as = child.getAttribute('as');
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        const t = document.createElement('template');
        t.innerHTML = child.innerHTML;
        walk(t.content, { ...scope, [as]: item, $index: i });
        frag.appendChild(t.content);
      });
      child.replaceWith(frag);
      continue;
    }
    for (const attr of [...child.attributes]) {
      if (!attr.value.includes('{{')) continue;
      const only = attr.value.match(holeOnly);
      if (attr.name.startsWith('on') && only) {
        const fn = get(scope, only[1]);
        child.removeAttribute(attr.name);
        if (typeof fn === 'function') child.addEventListener(attr.name.slice(2), fn);
      } else {
        child.setAttribute(attr.name, fill(attr.value, scope));
      }
    }
    walk(child, scope);
  }
}
function update() {
  const v = comp.renderVals();
  document.getElementById('letterModal').hidden = !v.hasOpen;
  document.getElementById('openName').textContent = v.openName;
  document.getElementById('openText').textContent = v.openText;
  document.getElementById('playLabel').textContent = v.playLabel;
  document.querySelectorAll('.reel').forEach((r) => r.classList.toggle('spin', !!comp.state.playing));
  if (comp.state.playing && audio.paused) audio.play().catch(() => {});
  if (!comp.state.playing && !audio.paused) audio.pause();
}
const app = document.getElementById('app');
const page = document.getElementById('tpl').content.cloneNode(true);
walk(page, comp.renderVals());
app.appendChild(page);
audio.addEventListener('ended', () => comp.setState({ playing: false }));
document.getElementById('letterModal').addEventListener('click', (e) => { if (e.target.id === 'letterModal' || e.target === e.currentTarget.firstElementChild) comp.setState({ open: -1 }); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && comp.state.open >= 0) comp.setState({ open: -1 }); });
update();
</script>
