<style>

.dk{background-image:radial-gradient(rgba(255,230,170,.1) 1px,transparent 1.6px);background-size:18px 18px}

.t-pink{background-image:url(assets/img/washi-hong.png)}
.t-mint{background-image:url(assets/img/washi-mint.png)}
.t-sun{background-image:url(assets/img/washi-vang.png)}
.t-ink{background-image:url(assets/img/washi-cham.png)}
.t-red{background-image:url(assets/img/washi-do.png)}

.clip{background:#F4EBD8}

.bob{animation:bob 4.5s ease-in-out infinite}
.swing{transform-origin:50% 0;animation:swing 5s ease-in-out infinite}
.spin{animation:spin 2.4s linear infinite}

.chip{display:inline-flex;align-items:center;justify-content:center;min-width:.8em;padding:0 .12em;margin:0 .04em;transform:rotate(var(--t,0deg));transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.chip:hover{transform:rotate(0deg) translateY(-8px) scale(1.12)}
.a{animation:pop .8s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--d,0s) + .45s)}
.a.up{animation-name:up}.a.fromL{animation-name:fromL}.a.fromR{animation-name:fromR}.a.drop{animation-name:drop}.a.stamp{animation-name:stampin}

.persp{perspective:900px}
.flip{position:relative;display:block;width:100%;height:100%;padding:0;border:none;background:none;cursor:pointer;perspective:1000px;font:inherit;color:inherit;text-align:center}
.flip .inner{position:absolute;inset:0;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip:hover .inner,.flip:focus-visible .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8cqw;padding:1.4cqw}
.face.back{transform:rotateY(180deg)}
.env{position:relative;display:block;width:100%;aspect-ratio:3 / 2;padding:0;border:none;background:none;cursor:pointer;font:inherit;color:inherit;perspective:700px}
.env .body{position:absolute;inset:0;background:#E3C690;box-shadow:0 8px 16px rgba(70,40,10,.2)}
.env .letter{position:absolute;left:9%;right:9%;top:12%;height:70%;background:#FFFDF6;z-index:1;transition:transform .55s cubic-bezier(.3,1.5,.5,1);padding:8px;font-family:'Patrick Hand',cursive;font-size:max(12px,1cqw);color:#6B5229;text-align:left}
.env .pocket{position:absolute;inset:0;z-index:2;background:#EBD3A3;clip-path:polygon(0 30%,50% 66%,100% 30%,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:3;background:#D9B675;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .5s ease,z-index 0s .25s}
.env:hover .flap,.env:focus-visible .flap{transform:rotateX(180deg);z-index:0}
.env:hover .letter,.env:focus-visible .letter{transform:translateY(-40%)}
.env .seal{position:absolute;left:50%;top:52%;z-index:4;width:2.8cqw;height:2.8cqw;min-width:28px;min-height:28px;translate:-50% -50%;border-radius:50%;background:#A82C17;color:#F8E9C8;display:flex;align-items:center;justify-content:center;font-family:'Dancing Script',cursive;font-size:max(13px,1.1cqw);transition:opacity .3s}
.env:hover .seal{opacity:0}
.one-letter .env .who{font-size:max(18px,2cqw)}
.one-letter .env .letter{font-size:max(15px,1.6cqw)}
.env .who{position:absolute;left:4px;right:4px;bottom:6%;z-index:4;font-family:'Patrick Hand',cursive;font-size:max(12px,1.05cqw);line-height:1.1;color:#3B2A12;text-align:center}
.stele{transition:transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .45s}
.stele:hover{transform:translateY(-8px);box-shadow:0 0 0 2px #E3B556,0 14px 24px rgba(227,181,86,.35)}
.lamp{transition:filter .4s}.lamp:hover{filter:brightness(1.3) drop-shadow(0 0 30px rgba(255,190,80,.95))}
.leaf{position:absolute;top:0;bottom:0;width:50%;z-index:40;transform-style:preserve-3d;pointer-events:none}
.leaf.next{left:50%;transform-origin:0 50%;animation:turnNext .95s cubic-bezier(.45,.05,.3,1) both}
.leaf.prev{left:0;transform-origin:100% 50%;animation:turnPrev .95s cubic-bezier(.45,.05,.3,1) both}
.leaf .lf,.leaf .lb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .lb{transform:rotateY(180deg)}
.leaf .lf::after,.leaf .lb::after{content:'';position:absolute;inset:0;pointer-events:none;animation:shade .95s ease-in-out both}
.leaf.next .lf,.leaf.prev .lb{border-radius:0 4px 4px 0;box-shadow:inset 26px 0 30px -18px rgba(70,40,10,.35),0 0 30px rgba(60,30,5,.3)}
.leaf.prev .lf,.leaf.next .lb{border-radius:4px 0 0 4px;box-shadow:inset -26px 0 30px -18px rgba(70,40,10,.35),0 0 30px rgba(60,30,5,.3)}
.clipL{clip-path:inset(0 50% 0 0)}
.clipR{clip-path:inset(0 0 0 50%)}
.old{animation:none}
.navbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:48px;min-height:48px;padding:0 18px;border:none;border-radius:999px;background:#FFF7E6;color:#3B2A12;font-family:'Patrick Hand',cursive;font-size:19px;cursor:pointer;box-shadow:0 6px 14px rgba(60,35,10,.25);transition:transform .25s}
.navbtn:hover{transform:translateY(-3px)}
.navbtn:disabled{opacity:.35;cursor:default;transform:none}
.tabs{position:absolute;right:-48px;top:4%;z-index:1;display:flex;flex-direction:column;gap:6px}
.tab{width:52px;height:38px;padding:0 0 0 18px;border:none;border-radius:0 8px 8px 0;font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:#FFF7E6;cursor:pointer;text-align:left;box-shadow:2px 3px 6px rgba(60,35,10,.25);transition:transform .25s}
.tab:hover,.tab.on{transform:translateX(8px)}
.corner{position:absolute;bottom:0;z-index:20;width:64px;height:64px;border:none;padding:0;cursor:pointer;background:transparent}
.corner span{position:absolute;inset:auto 0 0 auto;width:34px;height:34px;transition:width .3s,height .3s}
.corner.r{right:0}.corner.r span{background:linear-gradient(135deg,transparent 50%,#E6D6B4 50%);box-shadow:-3px -3px 6px rgba(60,35,10,.18);border-radius:0 0 4px 0}
.corner.l{left:0}.corner.l span{inset:auto auto 0 0;background:linear-gradient(225deg,transparent 50%,#E6D6B4 50%);box-shadow:3px -3px 6px rgba(60,35,10,.18);border-radius:0 0 0 4px}
.corner:hover span{width:56px;height:56px}
@media (max-width:820px){
.book{width:calc(100vw - 24px);aspect-ratio:auto;height:calc(100vh - 128px);--h2:36px;--b:16px;--k:18px;--cap:16px}
.spread{flex-direction:column;overflow-y:auto}
.pg{flex:none;height:auto;min-height:100%;overflow:visible;padding:28px 22px 48px}
.pgL,.pgR{border-radius:4px}
.tabs,.leaf,.corner,.hide-m,.old{display:none}
.clipL,.clipR{clip-path:none}
.mstack{flex-direction:column !important}
}
@keyframes spreadIn{from{opacity:0}to{opacity:1}}
@keyframes shade{0%{background:rgba(40,20,0,0)}50%{background:rgba(40,20,0,.18)}100%{background:rgba(40,20,0,0)}}
@keyframes turnNext{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes turnPrev{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
@keyframes pop{0%{opacity:0;scale:.45;rotate:-12deg}70%{opacity:1;scale:1.07;rotate:3deg}100%{opacity:1;scale:1;rotate:0deg}}
@keyframes up{from{opacity:0;translate:0 50px}to{opacity:1;translate:0 0}}
@keyframes fromL{0%{opacity:0;translate:-120px 0;rotate:-10deg}75%{opacity:1;translate:8px 0;rotate:2deg}100%{opacity:1;translate:0 0;rotate:0deg}}
@keyframes fromR{0%{opacity:0;translate:120px 0;rotate:10deg}75%{opacity:1;translate:-8px 0;rotate:-2deg}100%{opacity:1;translate:0 0;rotate:0deg}}
@keyframes drop{0%{opacity:0;translate:0 -100px;rotate:-14deg}70%{opacity:1;translate:0 8px;rotate:3deg}100%{opacity:1;translate:0 0;rotate:0deg}}
@keyframes stand{0%{opacity:0;rotate:x 88deg}70%{opacity:1;rotate:x -10deg}100%{opacity:1;rotate:x 0deg}}
@keyframes stampin{0%{opacity:0;scale:2.8;rotate:-30deg}60%{opacity:1;scale:.9;rotate:-6deg}100%{opacity:1;scale:1;rotate:-8deg}}
@keyframes wig{0%,100%{rotate:0deg}20%{rotate:-9deg}40%{rotate:7deg}60%{rotate:-5deg}80%{rotate:3deg}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes swing{0%,100%{rotate:-5deg}50%{rotate:5deg}}
@keyframes spin{to{rotate:360deg}}

/* Bản chia trang: một tờ giấy mỗi màn hình, trượt trái/phải */
.board,.leaf,.tabs,.corner{display:none !important}
.book{perspective:none}
.spread{filter:drop-shadow(0 22px 30px rgba(70,45,15,.35));clip-path:polygon(0% 12px,4% 3px,9% 11px,14% 2px,19% 9px,25% 3px,31% 11px,37% 4px,43% 12px,49% 2px,55% 10px,61% 3px,67% 11px,73% 3px,79% 9px,85% 2px,91% 11px,96% 4px,100% 10px,100% calc(100% - 11px),96% calc(100% - 3px),90% calc(100% - 10px),84% calc(100% - 2px),78% calc(100% - 11px),72% calc(100% - 3px),66% calc(100% - 12px),60% calc(100% - 3px),54% calc(100% - 9px),48% calc(100% - 2px),42% calc(100% - 11px),36% calc(100% - 4px),30% calc(100% - 10px),24% calc(100% - 2px),18% calc(100% - 11px),12% calc(100% - 3px),6% calc(100% - 9px),0% calc(100% - 4px))}
.pgL,.pgR{box-shadow:none;border-radius:0}
.pgR::before{content:'';position:absolute;left:0;top:6%;bottom:6%;border-left:2px dashed rgba(120,90,50,.18)}
.spread.clipL,.spread.clipR{clip-path:polygon(0% 12px,4% 3px,9% 11px,14% 2px,19% 9px,25% 3px,31% 11px,37% 4px,43% 12px,49% 2px,55% 10px,61% 3px,67% 11px,73% 3px,79% 9px,85% 2px,91% 11px,96% 4px,100% 10px,100% calc(100% - 11px),96% calc(100% - 3px),90% calc(100% - 10px),84% calc(100% - 2px),78% calc(100% - 11px),72% calc(100% - 3px),66% calc(100% - 12px),60% calc(100% - 3px),54% calc(100% - 9px),48% calc(100% - 2px),42% calc(100% - 11px),36% calc(100% - 4px),30% calc(100% - 10px),24% calc(100% - 2px),18% calc(100% - 11px),12% calc(100% - 3px),6% calc(100% - 9px),0% calc(100% - 4px))}
.spread.clipR{animation:inR .6s cubic-bezier(.2,.8,.2,1) both}
.spread.clipL{animation:inL .6s cubic-bezier(.2,.8,.2,1) both}

@keyframes inR{from{opacity:0;translate:90px 0;rotate:2deg}to{opacity:1;translate:0 0;rotate:0deg}}

.cover1{flex:1 1 100% !important}

.book{width:min(calc(100vw - 20px),calc((100vh - 20px) * 1.6)) !important}
.stage{gap:0 !important;padding:10px !important}

.gate .gl{left:0;box-shadow:inset -18px 0 24px -16px rgba(70,40,10,.25)}

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { page: 0, prevPage: 0, dir: 'next', flipping: false, open: -1, playing: false, gate: 'on', silk: {}, tra: false, quiz: {}, zoom: null, lanterns: [], egg: 0, auto: false }; this.tx = null; this.pausedByVideo = false; }

<audio id="bgm" src="assets/audio/giai-dieu-9.mp3" loop preload="auto"></audio>

<nav style="display: flex; align-items: center; gap: 16px" aria-label="Lật trang">

</article>
</div>` : null}
</main>`; } }
const comp = new Component({});
const root = document.getElementById('app');
let queued = false;
function draw() { queued = false; render(view(comp.renderVals()), root); }
function schedule() { if (!queued) { queued = true; Promise.resolve().then(draw); } }
draw();
if (comp.componentDidMount) comp.componentDidMount();
// Phím tắt trên máy tính: Enter mở quà, ← → lật trang, Esc đóng thư / ảnh
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea, video')) return;
  if (comp.state.gate === 'on') { if (e.key === 'Enter') comp.renderVals().openGift(); return; }
  if (e.key === 'ArrowRight') comp.go(comp.state.page + 1);
  else if (e.key === 'ArrowLeft') comp.go(comp.state.page - 1);
  else if (e.key === 'Escape') comp.setState({ open: -1, zoom: null });
});
</script>
