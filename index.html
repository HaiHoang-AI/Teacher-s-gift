<body>
<div id="app"></div>
<script>
const { h, render } = preact;
const html = htm.bind(h);
class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; } setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); schedule(); } forceUpdate() { schedule(); } }

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { page: 0, prevPage: 0, dir: 'next', flipping: false, open: -1, playing: true }; this.tx = null; this.pausedByVideo = false; }
  // Nhạc mặc định bật: thử phát ngay; nếu trình duyệt chặn thì phát ở lần chạm/bấm đầu tiên
  componentDidMount() {
    const evs = ['pointerdown', 'touchstart'];
    this.removeUnlock = () => evs.forEach((ev) => document.removeEventListener(ev, this.unlock, true));
    this.unlock = (e) => {
      this.removeUnlock();
      if (this.started) return;
      this.started = true;
      if (e.target && e.target.closest && e.target.closest('.musicBtn')) return;
      if (this.state.playing) this.music(true);
    };
    evs.forEach((ev) => document.addEventListener(ev, this.unlock, true));
    const a = document.getElementById('bgm');
    const r = a ? a.play() : null;
    if (r && r.then) r.then(() => { this.started = true; this.removeUnlock(); }).catch(() => {});
  }
  componentWillUnmount() { clearTimeout(this.timer); if (this.removeUnlock) this.removeUnlock(); }
  go(target) {
    const total = 12;
    this.page0Start(target);
    if (this.state.page === 6 && target !== 6 && this.pausedByVideo) { this.pausedByVideo = false; this.music(true); }
    if (this.state.flipping || target < 0 || target >= total || target === this.state.page) return;
    const dir = target > this.state.page ? 'next' : 'prev';
    this.setState({ page: target, prevPage: this.state.page, dir, flipping: true, open: -1 });
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.setState({ flipping: false }), 600);
  }
  page0Start(target) {
    if (this.state.page === 0 && target > 0 && !this.started) { this.started = true; this.music(true); }
  }
  music(on) {
    const a = document.getElementById('bgm');
    if (a) { if (on) { const r = a.play(); if (r && r.catch) r.catch(() => this.setState({ playing: false })); } else a.pause(); }
    this.setState({ playing: on });
  }
  renderVals() {
    const { page, dir } = this.state;
    const total = 12;
    const chapters = [

    const cream = { c: '#F6EDDA', t: 'tex' };

      [cream, cream],

      [{ c: '#3A1310', t: 'dk' }, { c: '#3A1310', t: 'dk' }],

    const flags = {};
    for (let i = 0; i < total; i++) {
      flags['s' + i] = page === i || (flipping && prevPage === i);
      let k = '';
      if (flipping && i === page) k = dir === 'next' ? 'clipR' : 'clipL';
      else if (flipping && i === prevPage) k = 'old ' + (dir === 'next' ? 'clipL' : 'clipR');
      flags['k' + i] = k;
    }
    return {
      ...flags,
      titleWords, words, wavesL: waves.slice(0, 2), wavesR: waves.slice(2), photos, lyrics, honors, fun, letters, tabs, toc,
      bookCls: '',
      showTabs: page > 0,

      leafBack: back.c, leafBackCls: back.t,
      canPrevCorner: page > 1,
      canNextCorner: page > 0 && page < total - 1,
      atStart: page === 0,
      atEnd: page === total - 1,
      label: names[page] + ' · ' + (page + 1) + '/' + total,
      next: () => this.go(page + 1),
      prev: () => this.go(page - 1),
      restart: () => this.go(0),
      touchStart: (e) => { const t = e.touches && e.touches[0]; this.tx = t ? t.clientX : null; },
      touchEnd: (e) => {
        const t = e.changedTouches && e.changedTouches[0];

        const dx = t.clientX - this.tx; this.tx = null;

      },
      hasOpen: this.state.open >= 0,
      openName: cur ? cur.name : '',
      openText: cur ? cur.text : '',
      close: () => this.setState({ open: -1 }),
      spinCls: this.state.playing ? 'spin' : '',
      playLabel: this.state.playing ? 'Đang phát… (bấm để dừng)' : 'Bật băng nghe bài hát',
      musicLabel: this.state.playing ? 'Nhạc: bật' : 'Nhạc: tắt',
      musicAria: this.state.playing ? 'Tắt nhạc nền' : 'Bật nhạc nền',
      noteCls: this.state.playing ? 'spin' : '',
      videoPlay: () => { const a = document.getElementById('bgm'); if (a && !a.paused) { this.pausedByVideo = true; this.music(false); } },
      togglePlay: () => { const a = document.getElementById('bgm'); this.pausedByVideo = false; this.started = true; this.music(a ? a.paused : !this.state.playing); }
    };
  }
